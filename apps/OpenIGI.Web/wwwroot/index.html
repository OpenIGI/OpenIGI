<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>OpenIGI</title>
  <style>
    html, body { margin: 0; height: 100%; background: #000; color: #d8d8d8; font: 15px/1.4 system-ui, sans-serif; }
    #view { display: block; width: 100vw; height: 100vh; outline: none; }
    #overlay { position: fixed; inset: 0; display: grid; place-content: center; gap: 12px; text-align: center; pointer-events: none; }
    #status { max-width: min(60ch, calc(100vw - 32px)); }
    #status:empty { display: none; }
    #pick { pointer-events: auto; font: inherit; padding: 8px 18px; }
  </style>
</head>
<body>
  <canvas id="view"></canvas>
  <div id="overlay">
    <div id="status">Loading…</div>
    <button id="pick" hidden>Choose folder</button>
  </div>
  <script type="module" src="main.js"></script>
</body>
</html>
