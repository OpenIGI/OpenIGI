# data.openigi.com: the game's files for the browser build, packed by pack.py, behind Cloudflare.
#
# Install on the server:
#   mkdir -p /srv/openigi-data/igi1 /etc/nginx/ssl
#   openssl req -x509 -newkey rsa:2048 -nodes -days 3650 -subj "/CN=data.openigi.com" \
#     -keyout /etc/nginx/ssl/data.openigi.com.key -out /etc/nginx/ssl/data.openigi.com.crt
#   cp nginx-data.conf /etc/nginx/sites-available/data.openigi.com
#   ln -s ../sites-available/data.openigi.com /etc/nginx/sites-enabled/ && nginx -t && systemctl reload nginx
# Upload (index.json last, so it never names a bundle not there yet):
#   rsync -av --exclude index.json <pack output>/ root@<server>:/srv/openigi-data/igi1/
#   rsync -av <pack output>/index.json root@<server>:/srv/openigi-data/igi1/
#
# The certificate is self-signed: Cloudflare's SSL mode for the zone is Full, which encrypts to the origin
# without checking its certificate.

server {
    listen 80;
    listen [::]:80;
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name data.openigi.com;

    ssl_certificate /etc/nginx/ssl/data.openigi.com.crt;
    ssl_certificate_key /etc/nginx/ssl/data.openigi.com.key;

    root /srv/openigi-data;
    autoindex off;
    # The bundles are gzip already; the page checks their hash as served, so nothing may re-encode them.
    gzip off;

    add_header Access-Control-Allow-Origin "*" always;
    add_header Access-Control-Allow-Headers "Range" always;
    add_header Access-Control-Expose-Headers "Content-Length, Content-Range" always;

    location ~ \.bin\.gz$ {
        types { }
        default_type application/octet-stream;
        add_header Access-Control-Allow-Origin "*" always;
        add_header Access-Control-Allow-Headers "Range" always;
        add_header Access-Control-Expose-Headers "Content-Length, Content-Range" always;
        # Named by their hash: never change, so cached for good.
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        if ($request_method = OPTIONS) { return 204; }
    }

    location ~ /index\.json$ {
        add_header Access-Control-Allow-Origin "*" always;
        add_header Cache-Control "no-cache" always;
    }

    location / {
        return 404;
    }
}
