# A co-op client's debugging run (temporary): traces both sides, moves the player to guards, shoots them, has the server
# hurt and kill them, and quits. Each line is '<seconds> <console command>', counted from when the session is in its level.
#
#   OpenIGI.Desktop -title igi2 -connect <server> -name Probe +rcon_password <password> +dbg_run <path to this file>
#
# then fetch the server's trace (netprobe/ beside its settings) and run compare.py on the two.
0    dbg_trace on
0    dbg trace on
1    dbg_trace mark start
1    dbg trace mark start
1    dbg guards @me
2    dbg tp @me nearest:@me 10
4    dbg_trace mark shoot-standing
4    dbg_shoot nearest 1.5
8    dbg_trace mark walk
8    dbg_walk 2
11   dbg_trace mark server-hurt
11   dbg hurt nearest:@me 0.3
14   dbg hurt nearest:@me 0.3
17   dbg_trace mark server-kill
17   dbg kill nearest:@me
21   dbg tp @me nearest:@me 12
23   dbg_trace mark shoot-to-kill
23   dbg_shoot nearest 4
30   dbg tp @me nearest:@me 15
32   dbg_trace mark shoot-to-kill-2
32   dbg_shoot nearest 4
40   dbg_trace mark end
40   dbg trace mark end
41   dbg_trace off
41   dbg trace off
43   quit
