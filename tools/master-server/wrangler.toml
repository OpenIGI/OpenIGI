name = "openigi-master"
main = "src/index.js"
compatibility_date = "2026-10-01"

# master.openigi.com is served from the release VM since 2026-11-10 (selfhost/: the same code under workerd, no daily
# Durable Object allowance). This Worker keeps no domain -- a route here would take the name back from the VM's DNS record.

# The built-in relay, every room's last resort: coturn on the data.openigi.com VM in Frankfurt (tools/turn). Its secret
# is the Worker secret TURN_SECRET (`wrangler secret put TURN_SECRET`; `.dev.vars` locally), never here. Other relays
# are added through the admin routes (ADMIN_TOKEN) and their secrets kept encrypted under RELAY_KEY, both secrets too.
[vars]
TURN_HOST = "turn.openigi.com"
TURN_REGION = "Europe"
TURN_LAT = "50.1"
TURN_LON = "8.7"
# Listed by /v1/servers and counted by /v1/stats only while the Durable Objects can't answer (the free plan's daily
# requests spent): the official servers, which a game then asks over UDP for what they play.
FALLBACK_SERVERS = '[{"address":"185.110.190.243","port":26001,"title":"igi1","name":"Official OpenIGI EU","version":"0.6.7.1","mode":"tdm","map":"1","maxPlayers":16,"region":"eu"}]'

# The relays probed every minute, so one that stops answering stops being handed out.
[triggers]
crons = ["* * * * *"]

# The whole list lives in one Durable Object, kept in its storage too so a restart doesn't empty it. Each co-op room
# is a Durable Object of its own, named by its code. SQLite-backed: the only kind the Workers free plan has.
[[durable_objects.bindings]]
name = "SERVER_LIST"
class_name = "ServerList"

[[durable_objects.bindings]]
name = "ROOMS"
class_name = "Room"

# Each party (friends following their leader from server to server) is a Durable Object of its own, named by its code.
[[durable_objects.bindings]]
name = "PARTIES"
class_name = "Party"

# The relay list: who they are, their secrets, and how their last probes went.
[[durable_objects.bindings]]
name = "RELAYS"
class_name = "Relays"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["ServerList", "Room"]

[[migrations]]
tag = "v2"
new_sqlite_classes = ["Relays"]

[[migrations]]
tag = "v3"
new_sqlite_classes = ["Party"]
