name = "openigi-master"
main = "src/index.js"
compatibility_date = "2026-10-01"

# Served at master.openigi.com; Cloudflare makes the DNS record for a custom domain itself.
routes = [{ pattern = "master.openigi.com", custom_domain = true }]

# Where the game's WebRTC connections find STUN and TURN: coturn on the data.openigi.com VM (tools/turn). The relay's
# shared secret is the Worker secret TURN_SECRET (`wrangler secret put TURN_SECRET`; `.dev.vars` locally), never here.
[vars]
TURN_HOST = "turn.openigi.com"

# The whole list lives in one Durable Object; heartbeats keep it current, so nothing needs persisting. Each co-op room
# is a Durable Object of its own, named by its code. SQLite-backed: the only kind the Workers free plan has.
[[durable_objects.bindings]]
name = "SERVER_LIST"
class_name = "ServerList"

[[durable_objects.bindings]]
name = "ROOMS"
class_name = "Room"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["ServerList", "Room"]
