name: MVP retail E2E
on:
  workflow_dispatch:
  pull_request:
    paths: ['src/**', 'apps/**', 'tools/test/**', '.github/workflows/e2e-mvp.yml']
jobs:
  live-mvp:
    runs-on: [self-hosted, macOS, igi-retail]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Validate retail data
        run: test -d "$IGI_GAME_PATH" && test -f "$IGI_GAME_PATH/IGI.EXE"
      - name: Run Levels 1-5 smoke captures
        run: tools/test/verify-e2e-mvp.sh
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mvp-e2e-captures
          path: scratch/mvp-e2e/
