name: CI image

# Rebuilds ghcr.io/openigi/ci, the image every other workflow's jobs run in, when its Dockerfile changes:
# on develop and master, and on ci/* branches, which is where a change to the image is made and proven.
on:
  push:
    branches: [develop, master, "ci/**"]
    paths: [deploy/ci/**, .github/workflows/ci-image.yml]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: ci-image
  cancel-in-progress: false

jobs:
  image:
    runs-on: ${{ fromJSON(vars.CI_RUNS_ON || '["self-hosted","sh-de"]') }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Build and push
        env:
          IMAGE: ghcr.io/openigi/ci
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "$TOKEN" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          docker build --pull -t "$IMAGE:latest" -t "$IMAGE:${GITHUB_SHA::12}" deploy/ci
          docker run --rm "$IMAGE:latest" sh -c 'dotnet --version && dotnet workload list | grep wasm-tools && git-cliff --version && rcodesign --version && gh --version | head -1 && zip -v | head -2 | tail -1'
          docker push "$IMAGE:latest"
          docker push "$IMAGE:${GITHUB_SHA::12}"
          docker logout ghcr.io
