name: Publish release

# Builds, tests, packages and publishes one tagged release:
#   - every download (the game in two flavours for Windows, Linux and macOS; or, for a launcher release,
#     the launcher alone) on the GitHub release, with the changelog as its notes;
#   - the same archives and their manifest on the download store, which the update service indexes, so the
#     launcher offers the release within a minute;
#   - the web build on openigi.com (stable) or beta.openigi.com (beta).
#
# Run by the Release button (release-cut.yml), by pushing a vX.Y.Z / vX.Y.Z-beta.N tag by hand, or, for a tag
# already pushed, by Run workflow with its name (a tag push does not always start a run). One job,
# because everything happens on one machine and the archives would otherwise be stored as workflow
# artefacts in between, which a private repository's storage cannot hold.
on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
      - "v[0-9]+.[0-9]+.[0-9]+-beta.[0-9]+"
      - "launcher-v[0-9]+.[0-9]+.[0-9]+"
  workflow_call:
    inputs:
      tag:
        type: string
        required: true
  workflow_dispatch:
    inputs:
      tag:
        description: The release tag to publish, already pushed (v0.4.0, v0.5.0-beta.1, launcher-v0.4.1)
        type: string
        required: true

permissions:
  contents: write
  packages: read
  # nuget.org's Trusted Publishing: the job's OIDC token is traded for a short-lived push key.
  id-token: write

concurrency:
  group: publish-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  TAG: ${{ inputs.tag || github.ref_name }}
  NUGET_PACKAGES: ${{ github.workspace }}/.nuget/packages
  RUNTIMES: win-x64 linux-x64 osx-arm64

# Steps run in bash everywhere: a job container's default shell is sh, which has no arrays or ${x::n}.
defaults:
  run:
    shell: bash

jobs:
  publish:
    name: publish ${{ inputs.tag || github.ref_name }}
    runs-on: ${{ fromJSON(vars.CI_RUNS_ON || '["self-hosted","sh-de"]') }}
    timeout-minutes: 120
    container:
      image: ghcr.io/openigi/ci:latest
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: refs/tags/${{ env.TAG }}
          fetch-depth: 0

      - name: Read the tag
        id: tag
        run: |
          # The game's line (v0.2.0, v0.2.0-beta.3) and the launcher's own (launcher-v0.1.1, stable only).
          product=game; version="${TAG#v}"
          if [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+-beta\.[0-9]+$ ]]; then channel=beta; branch=develop
          elif [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then channel=stable; branch=master
          elif [[ "$TAG" =~ ^launcher-v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then product=launcher; version="${TAG#launcher-v}"; channel=stable; branch=master
          else echo "::error::$TAG is not a release tag (vX.Y.Z, vX.Y.Z-beta.N or launcher-vX.Y.Z)"; exit 1; fi

          # A beta is built from develop and a stable release from master, never from a feature branch.
          git fetch --no-tags origin "$branch"
          if ! git merge-base --is-ancestor "$TAG^{commit}" "origin/$branch"; then
            echo "::error::$TAG is not on $branch, so it cannot be a $channel release."; exit 1
          fi

          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "product=$product" >> "$GITHUB_OUTPUT"
          echo "channel=$channel" >> "$GITHUB_OUTPUT"
          echo "commit=$(git rev-parse "$TAG^{commit}")" >> "$GITHUB_OUTPUT"

      - name: Write the notes
        run: tools/release/notes.sh "$TAG" "$RUNNER_TEMP/notes"

      - uses: actions/cache@v6
        with:
          path: .nuget/packages
          key: nuget-release-${{ hashFiles('Directory.Packages.props', 'global.json', '**/*.csproj') }}
          restore-keys: nuget-

      - name: Test
        env:
          # No sound device on a runner: OpenAL's silent backend, so audio start-up cannot take the host down.
          ALSOFT_DRIVERS: "null"
        run: |
          dotnet restore OpenIGI.slnx
          dotnet build OpenIGI.slnx --configuration Release --no-restore -p:Version=${{ steps.tag.outputs.version }}
          dotnet test OpenIGI.slnx --configuration Release --no-build

      - name: Package
        env:
          VERSION: ${{ steps.tag.outputs.version }}
          PRODUCT: ${{ steps.tag.outputs.product }}
        run: |
          rm -rf artifacts/release artifacts/web
          if [ "$PRODUCT" = launcher ]; then
            # The launcher alone, self-contained only: the one program a player starts with nothing installed.
            for rid in $RUNTIMES; do
              tools/release/package.sh launcher "$rid" "$VERSION" self-contained
            done
          else
            # The game in both flavours: self-contained, and the smaller build for machines with .NET 10. The
            # launcher is not part of a game release; it has its own line (launcher-v tags).
            for rid in $RUNTIMES; do
              tools/release/package.sh game "$rid" "$VERSION" self-contained
              tools/release/package.sh game "$rid" "$VERSION" dotnet
            done
            # The browser build goes to the site, not into the downloads.
            tools/release/package.sh web browser-wasm "$VERSION"
          fi

      - name: Write the manifest
        run: |
          dotnet run --project tools/OpenIGI.Tools.Release --configuration Release -- manifest \
            --version "${{ steps.tag.outputs.version }}" --channel "${{ steps.tag.outputs.channel }}" \
            --commit "${{ steps.tag.outputs.commit }}" \
            --notes "$RUNNER_TEMP/notes/context.json" --assets artifacts/release --tag "$TAG"

      - name: Publish the GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.tag.outputs.version }}
          CHANNEL: ${{ steps.tag.outputs.channel }}
          PRODUCT: ${{ steps.tag.outputs.product }}
        run: |
          v="$VERSION"
          repo="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY"
          dl="$repo/releases/download/$TAG"
          {
            cat "$RUNNER_TEMP/notes/notes.md"
            echo
            echo "---"
            echo
            echo "### Downloads"
            echo
            if [ "$PRODUCT" = launcher ]; then
              echo "The **OpenIGI Launcher** installs the game, keeps it up to date and starts it, and picks the right build for your machine. Launchers already installed update themselves to this one."
              echo
              echo "| Windows | Linux | macOS (Apple silicon) |"
              echo "|---|---|---|"
              echo "| [openigi-launcher-$v-win-x64.exe]($dl/openigi-launcher-$v-win-x64.exe) | [openigi-launcher-$v-linux-x64]($dl/openigi-launcher-$v-linux-x64) | [openigi-launcher-$v-osx-arm64.tar.gz]($dl/openigi-launcher-$v-osx-arm64.tar.gz) |"
            else
              echo "The easiest way to play is the **OpenIGI Launcher** ([openigi.com](https://openigi.com) or its [releases]($repo/releases)), which installs this build for you$( [ "$CHANNEL" = beta ] && echo ' once its update channel is set to Beta')."
              echo "To run the game yourself, each build comes in two flavours:"
              echo "**self-contained** runs on any machine, and **.NET** is a fraction of the size but needs the [.NET 10 runtime](https://dotnet.microsoft.com/download/dotnet/10.0) installed."
              echo
              # platform, runtime, extension
              row() {
                echo "| $1 | [openigi-game-$v-$2$3]($dl/openigi-game-$v-$2$3) | [openigi-game-$v-$2-dotnet$3]($dl/openigi-game-$v-$2-dotnet$3) |"
              }
              echo "| | Self-contained | Needs .NET 10 |"
              echo "|---|---|---|"
              row Windows win-x64 .exe
              row Linux linux-x64 ""
              row "macOS (Apple silicon)" osx-arm64 .tar.gz
            fi
            echo
            echo "Windows and Linux builds are a single executable (on Linux, \`chmod +x\` it first). macOS builds are an app in a tarball."
            echo "On macOS and Linux, the launcher installs with one command: \`curl -fsSL https://openigi.com/install.sh | bash\`."
            echo "The macOS builds are not notarized, so macOS reports an app downloaded with a browser as \"damaged\"; clear that with \`xattr -dr com.apple.quarantine \"/Applications/OpenIGI Launcher.app\"\` (or the app's path)."
            echo "OpenIGI needs your own copy of Project I.G.I.; it ships none of the game's data. Verify a download with \`sha256sum -c SHA256SUMS\`."
          } > "$RUNNER_TEMP/notes/release.md"
          cp "$RUNNER_TEMP/notes/notes.md" artifacts/release/CHANGELOG.md

          # "Latest" on the repository's release page is the newest game release; a launcher release never
          # takes it over.
          title="OpenIGI $VERSION"; flags=(--latest)
          [ "$CHANNEL" = beta ] && flags=(--prerelease --latest=false)
          [ "$PRODUCT" = launcher ] && { title="OpenIGI Launcher $VERSION"; flags=(--latest=false); }
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" artifacts/release/* --clobber
          else
            gh release create "$TAG" artifacts/release/* --verify-tag "${flags[@]}" \
              --title "$title" --notes-file "$RUNNER_TEMP/notes/release.md"
          fi

      # What mods build against, at this game's version: OpenIGI.Modding.Sdk, the assemblies it brings and the
      # `dotnet new openigi-mod` template, on nuget.org. The key is nuget.org's Trusted Publishing: no stored
      # secret, a key minted for this run from its OIDC token, against the policy NUGET_USER (the nuget.org
      # profile that owns it) set up for this repository and release.yml. A package version pushed there can be
      # unlisted but never replaced, so a failed push is reported and the release goes on.
      - name: Sign in to nuget.org
        id: nuget
        if: steps.tag.outputs.product != 'launcher' && vars.NUGET_USER != ''
        continue-on-error: true
        uses: NuGet/login@v1
        with:
          user: ${{ vars.NUGET_USER }}

      - name: Publish the modding SDK
        if: steps.tag.outputs.product != 'launcher'
        env:
          NUGET_API_KEY: ${{ steps.nuget.outputs.NUGET_API_KEY }}
          VERSION: ${{ steps.tag.outputs.version }}
        run: |
          if [ -z "$NUGET_API_KEY" ]; then
            echo "::notice::No nuget.org sign-in (set the NUGET_USER variable): the modding SDK is not published."
            exit 0
          fi
          rm -rf artifacts/nuget
          tools/release/pack-modding-sdk.sh "$VERSION" artifacts/nuget
          dotnet nuget push "artifacts/nuget/*.nupkg" --api-key "$NUGET_API_KEY" \
            --source https://api.nuget.org/v3/index.json --skip-duplicate \
            || echo "::warning::The modding SDK did not publish."

      # ssh reads ~/.ssh from the account's home in the password database, not from $HOME, and inside a job
      # container the two differ; so everything lives in the job's temp folder and every call passes -F.
      - name: Connect to the release VM
        env:
          KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          dir="$RUNNER_TEMP/ssh"
          mkdir -p "$dir" && chmod 700 "$dir"
          printf '%s\n' "$KEY" > "$dir/deploy" && chmod 600 "$dir/deploy"
          printf '%s\n' "$KNOWN_HOSTS" > "$dir/known_hosts"
          # One multiplexed connection for every command: the VM rate-limits new SSH connections.
          cat > "$dir/config" <<EOF
          Host release-vm
            HostName ${{ vars.DEPLOY_HOST }}
            User deploy
            IdentityFile $dir/deploy
            IdentitiesOnly yes
            UserKnownHostsFile $dir/known_hosts
            StrictHostKeyChecking yes
            ControlMaster auto
            ControlPath $dir/cm-%C
            ControlPersist 10m
            ServerAliveInterval 30
          EOF
          echo "VM_SSH=ssh -F $dir/config" >> "$GITHUB_ENV"
          ssh -F "$dir/config" release-vm status

      - name: Publish the downloads
        run: |
          verb=release; [ "${{ steps.tag.outputs.product }}" = launcher ] && verb=launcher
          tar -C artifacts/release --exclude CHANGELOG.md -czf - . \
            | $VM_SSH release-vm "$verb" "${{ steps.tag.outputs.version }}"

      - name: Deploy the web build
        if: steps.tag.outputs.product == 'game'
        run: |
          $VM_SSH release-vm web "${{ steps.tag.outputs.channel }}" "${{ steps.tag.outputs.version }}" \
            < "artifacts/web/openigi-web-${{ steps.tag.outputs.version }}.tar.gz"

      - name: Drop old betas
        if: steps.tag.outputs.channel == 'beta'
        run: $VM_SSH release-vm prune

      # The point of all this: the launcher sees it. The service rescans every 15 s.
      - name: Check the update service offers it
        env:
          VERSION: ${{ steps.tag.outputs.version }}
          CHANNEL: ${{ steps.tag.outputs.channel }}
          PRODUCT: ${{ steps.tag.outputs.product }}
        run: |
          # A game release must be the channel's newest; a launcher release the feed's launcher.
          field=.latest.version; [ "$PRODUCT" = launcher ] && field=.launcher.version
          for attempt in $(seq 1 12); do
            latest=$(curl -fsS "https://api.openigi.com/v1/channels/$CHANNEL" | jq -r "$field // empty" || true)
            [ "$latest" = "$VERSION" ] && { echo "api.openigi.com offers $VERSION on $CHANNEL"; break; }
            [ "$attempt" = 12 ] && { echo "::error::the update service still offers '${latest:-nothing}' on $CHANNEL"; exit 1; }
            sleep 10
          done
          {
            echo "### Released $TAG on the $CHANNEL channel"
            echo
            echo "| Archive | Size |"
            echo "|---|---:|"
            jq -r '.assets[] | "| \(.name) | \(.size / 1048576 | floor) MB |"' artifacts/release/release.json
            echo
            cat "$RUNNER_TEMP/notes/notes.md"
          } >> "$GITHUB_STEP_SUMMARY"
