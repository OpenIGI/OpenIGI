name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:

jobs:
  build:
    name: build-and-test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ windows-latest, ubuntu-latest, macos-latest ]
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore OpenIGI.slnx

      - name: Build
        run: dotnet build OpenIGI.slnx --configuration Release --no-restore

      - name: Test
        env:
          # Ubuntu runners do not provide a stable audio device. Keep OpenAL on its
          # supported silent backend so native audio initialisation cannot take down
          # the test host while the tests are exercising the no-audio contract.
          ALSOFT_DRIVERS: ${{ matrix.os == 'ubuntu-latest' && 'null' || '' }}
        run: dotnet test OpenIGI.slnx --configuration Release --no-build --verbosity normal
