name: CI

on:
  push:
    branches: [ master, develop ]
  pull_request:
    branches: [ master, develop ]

jobs:
  build:
    name: build-and-test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ windows-latest, ubuntu-latest, macos-latest ]
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Install OpenAL (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libopenal-dev

      - name: Restore
        run: dotnet restore OpenIGI.slnx

      - name: Build
        run: dotnet build OpenIGI.slnx --configuration Release --no-restore

      - name: Test
        run: dotnet test OpenIGI.slnx --configuration Release --no-build --verbosity normal
