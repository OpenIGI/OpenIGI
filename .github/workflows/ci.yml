name: CI

on:
  push:
    branches: [ master, develop ]
  pull_request:
    branches: [ master, develop ]

jobs:
  # The shader library is compiled ahead of time and its output committed, so that a contributor without
  # slangc can still build and run the game. This is what stops that output going stale: a source edited
  # without its compiled form following is a game that draws last week's shader.
  #
  # Windows, and the tagged Windows download, because that is the pairing that was actually measured
  # against the committed output: it and the Vulkan SDK's own build of the same release produce
  # byte-identical SPIR-V for every artefact. Another platform's build of it very likely does too and has
  # not been checked, so it is not what the gate runs on.
  shaders:
    name: shader-library
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      # The release is read out of the manifest, so the compiler installed here and the one the output
      # was produced with cannot drift apart without the check saying so.
      - name: Install slangc
        shell: pwsh
        run: |
          $pinned = (Get-Content src/OpenIGI.Shaders/ShaderModules.json -Raw | ConvertFrom-Json).slangVersion
          $release = $pinned.Split('-')[0]
          Write-Host "Pinned slang release: $release (from $pinned)"
          $url = "https://github.com/shader-slang/slang/releases/download/v$release/slang-$release-windows-x86_64.zip"
          Invoke-WebRequest -Uri $url -OutFile slang.zip
          Expand-Archive -Path slang.zip -DestinationPath "$env:RUNNER_TEMP/slang" -Force
          "OPENIGI_SLANGC=$env:RUNNER_TEMP/slang/bin/slangc.exe" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Check the committed output
        run: dotnet run --project tools/OpenIGI.Tools.ShaderBuild --configuration Release -- --check

  build:
    name: build-and-test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ windows-latest, ubuntu-latest, macos-latest ]
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Install OpenAL (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libopenal-dev

      - name: Restore
        run: dotnet restore OpenIGI.slnx

      - name: Build
        run: dotnet build OpenIGI.slnx --configuration Release --no-restore

      - name: Test
        run: dotnet test OpenIGI.slnx --configuration Release --no-build --verbosity normal

      # Vulkan on macOS is MoltenVK, which arrives through a NuGet package rather than a system loader.
      # Building proves the C# compiles; only a publish for the real runtime identifier proves the dylib
      # is actually restored and lands beside the executable, which is the difference between an app that
      # starts and one that fails at vkCreateInstance with nothing to explain why.
      - name: Package (macOS)
        if: runner.os == 'macOS'
        run: tools/package-macos.sh osx-arm64 Release
