name: Deploy services

# Deploys what runs on the release VM: the update service (services/OpenIGI.Services) and the Caddy and
# compose configuration beside it (deploy/vm). There is one instance and it serves both channels, so it
# follows master; Run workflow deploys any branch's build on purpose.
on:
  push:
    branches: [master]
    paths:
      - services/**
      - src/Core/OpenIGI.Releases/**
      - deploy/vm/compose.yml
      - deploy/vm/Caddyfile
      - .github/workflows/deploy-services.yml
  workflow_dispatch:

permissions:
  contents: read
  packages: read

concurrency:
  group: deploy-services
  cancel-in-progress: false

env:
  NUGET_PACKAGES: ${{ github.workspace }}/.nuget/packages

# Steps run in bash everywhere: a job container's default shell is sh, which has no arrays or ${x::n}.
defaults:
  run:
    shell: bash

jobs:
  deploy:
    runs-on: ${{ fromJSON(vars.CI_RUNS_ON || '["self-hosted","sh-de"]') }}
    timeout-minutes: 20
    container:
      image: ghcr.io/openigi/ci:latest
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/cache@v6
        with:
          path: .nuget/packages
          key: nuget-services-${{ hashFiles('Directory.Packages.props', 'global.json', '**/*.csproj') }}
          restore-keys: nuget-

      - name: Test
        run: dotnet test tests/OpenIGI.Services.Tests --configuration Release

      - name: Publish
        run: dotnet publish services/OpenIGI.Services --configuration Release -p:DebugType=none --output "$RUNNER_TEMP/api"

      # ssh reads ~/.ssh from the account's home in the password database, not from $HOME, and inside a job
      # container the two differ; so everything lives in the job's temp folder and every call passes -F.
      - name: Connect to the release VM
        env:
          KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          dir="$RUNNER_TEMP/ssh"
          mkdir -p "$dir" && chmod 700 "$dir"
          printf '%s\n' "$KEY" > "$dir/deploy" && chmod 600 "$dir/deploy"
          printf '%s\n' "$KNOWN_HOSTS" > "$dir/known_hosts"
          # One multiplexed connection for every command: the VM rate-limits new SSH connections.
          cat > "$dir/config" <<EOF
          Host release-vm
            HostName ${{ vars.DEPLOY_HOST }}
            User deploy
            IdentityFile $dir/deploy
            IdentitiesOnly yes
            UserKnownHostsFile $dir/known_hosts
            StrictHostKeyChecking yes
            ControlMaster auto
            ControlPath $dir/cm-%C
            ControlPersist 10m
            ServerAliveInterval 30
          EOF
          echo "VM_SSH=ssh -F $dir/config" >> "$GITHUB_ENV"
          ssh -F "$dir/config" release-vm status

      # The service first, then the configuration: a configuration may name settings only the new service
      # understands (the download address's {folder}), and the old service would serve broken links meanwhile.
      - name: Deploy the update service
        run: tar -C "$RUNNER_TEMP/api" -czf - . | $VM_SSH release-vm api "${GITHUB_SHA::12}"

      - name: Apply the configuration
        run: tar -C deploy/vm -czf - compose.yml Caddyfile | $VM_SSH release-vm config

      - name: Check it answers
        run: |
          sleep 5
          curl -fsS https://api.openigi.com/healthz
          $VM_SSH release-vm status
