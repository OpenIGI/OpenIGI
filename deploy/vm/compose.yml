# What runs on the release VM: Caddy in front, the update service behind it.
#
# Everything a release changes lives under /srv/openigi and is mounted read-only here, so a deploy is a
# folder swap (deploy/vm/deploy.sh) rather than a container rebuild; only a new update-service build
# recreates the api container. Installed to /srv/openigi/config by `deploy.sh config`.
name: openigi

services:
  caddy:
    image: caddy:2.10-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - /srv/openigi/web:/srv/web:ro
      - /srv/openigi/dl:/srv/dl:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - api

  api:
    # The stock runtime image; the service's build is mounted in, so its version is the folder's.
    image: mcr.microsoft.com/dotnet/aspnet:10.0
    restart: unless-stopped
    user: "1654:1654"
    working_dir: /app
    command: ["dotnet", "/app/OpenIGI.Services.dll"]
    environment:
      ASPNETCORE_URLS: http://+:8080
      Releases__Root: /srv/dl/releases
      Releases__DownloadUrl: https://dl.openigi.com/releases/{folder}/{name}
    volumes:
      - /srv/openigi/api/current:/app:ro
      - /srv/openigi/dl/releases:/srv/dl/releases:ro
    healthcheck:
      # The runtime image has no curl; bash's /dev/tcp is enough for one GET.
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8080 && printf 'GET /healthz HTTP/1.0\\r\\n\\r\\n' >&3 && grep -q '^ok' <&3"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  caddy-data:
  caddy-config:
