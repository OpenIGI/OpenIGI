# Publishes the versions a merge adds to OpenIGI's content store (OpenIGI/openigi-content's releases).
#
# In two jobs, so the mods' code never runs where the publishing key is: the first builds each version from its
# source, with only a read token; the second, in the mods-publish environment that holds the publisher app's key,
# only chunks and uploads what the first built, then starts OpenIGI's site build, which lists it. The source and
# commit a listing names come from the index, never from the package.
name: Publish

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      added: ${{ steps.added.outputs.list }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          path: index
      - uses: actions/checkout@v4
        with:
          repository: OpenIGI/OpenIGI
          ref: master
          path: openigi
          token: ${{ secrets.OPENIGI_READ_TOKEN || github.token }}
      # While OpenIGI and its mods' repositories are private, the clone a build makes reads them with this token. It
      # can only read, and only those repositories; a pull request from a fork gets no secrets and so reads public ones.
      - name: Read the private repositories
        env:
          TOKEN: ${{ secrets.OPENIGI_READ_TOKEN }}
        run: |
          [ -z "$TOKEN" ] || git config --global url."https://x-access-token:$TOKEN@github.com/".insteadOf "https://github.com/"

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet build openigi/tools/OpenIGI.Tools.Release -c Release

      # A mod that builds against OpenIGI's source (its Directory.Build.props points at OPENIGI_ROOT) finds it here.
      - name: Build every version added
        id: added
        env:
          OPENIGI_ROOT: ${{ github.workspace }}/openigi
        run: |
          tool="dotnet openigi/tools/OpenIGI.Tools.Release/bin/Release/net10.0/OpenIGI.Tools.Release.dll"
          $tool mods-index check index
          $tool mods-index added index --base "${{ github.event.before }}" > added.txt
          while read -r id version; do
            $tool mods-index build index "$id" "$version" --out "packages/$id/$version" --work "$RUNNER_TEMP/source/$id"
          done < added.txt
          echo "list=$(tr '\n' ';' < added.txt)" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: packages
          path: packages
          if-no-files-found: ignore

  publish:
    needs: build
    if: needs.build.outputs.added != ''
    runs-on: ubuntu-latest
    environment: mods-publish
    steps:
      - uses: actions/checkout@v4
        with:
          path: index
      - uses: actions/checkout@v4
        with:
          repository: OpenIGI/OpenIGI
          ref: master
          path: openigi
          token: ${{ secrets.OPENIGI_READ_TOKEN || github.token }}
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet build openigi/tools/OpenIGI.Tools.Release -c Release
      - uses: actions/download-artifact@v4
        with:
          name: packages
          path: packages

      # The publisher app's token, for the content store's releases and OpenIGI's site build alone. An app's key does not
      # expire, as a personal token would.
      - id: app
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.PUBLISH_APP_CLIENT_ID }}
          private-key: ${{ secrets.PUBLISH_APP_KEY }}
          owner: OpenIGI
          repositories: openigi-content,OpenIGI
          permission-contents: write
          permission-actions: write

      - name: Publish
        env:
          ADDED: ${{ needs.build.outputs.added }}
          GH_TOKEN: ${{ steps.app.outputs.token }}
        run: |
          tool="dotnet openigi/tools/OpenIGI.Tools.Release/bin/Release/net10.0/OpenIGI.Tools.Release.dll"
          printf '%s' "$ADDED" | tr ';' '\n' | while read -r id version; do
            [ -n "$id" ] || continue
            $tool mods-index publish index "$id" "$version" --package "packages/$id/$version"
          done
