# Checks a pull request to the index and builds every version it adds.
#
# Untrusted: a pull request's mod is built here, and MSBuild runs what a project tells it to. So this runs on a
# GitHub-hosted runner, never the release VM's self-hosted one, with read-only tokens and no other secret.
name: Validate

on:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          path: index

      # The index's rules are OpenIGI's release tool's, at the version that publishes.
      - uses: actions/checkout@v4
        with:
          repository: OpenIGI/OpenIGI
          ref: master
          path: openigi
          token: ${{ secrets.OPENIGI_READ_TOKEN || github.token }}

      # While OpenIGI and its mods' repositories are private, the clone a build makes reads them with this token. It
      # can only read, and only those repositories; a pull request from a fork gets no secrets and so reads public ones.
      - name: Read the private repositories
        env:
          TOKEN: ${{ secrets.OPENIGI_READ_TOKEN }}
        run: |
          [ -z "$TOKEN" ] || git config --global url."https://x-access-token:$TOKEN@github.com/".insteadOf "https://github.com/"

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Build the tool
        run: dotnet build openigi/tools/OpenIGI.Tools.Release -c Release

      - name: Check the index and who changes it
        run: |
          dotnet openigi/tools/OpenIGI.Tools.Release/bin/Release/net10.0/OpenIGI.Tools.Release.dll mods-index check index \
            --base "origin/${{ github.base_ref }}" --author "${{ github.event.pull_request.user.login }}"

      # A mod that builds against OpenIGI's source (Directory.Build.props in OpenIGI/igi2-soldiers) finds it here.
      - name: Build every version added
        env:
          OPENIGI_ROOT: ${{ github.workspace }}/openigi
        run: |
          tool="dotnet openigi/tools/OpenIGI.Tools.Release/bin/Release/net10.0/OpenIGI.Tools.Release.dll"
          $tool mods-index added index --base "origin/${{ github.base_ref }}" | while read -r id version; do
            $tool mods-index build index "$id" "$version" --out "packages/$id/$version" --work "$RUNNER_TEMP/source/$id"
            $tool mods-index publish index "$id" "$version" --package "packages/$id/$version" --to-dir "$RUNNER_TEMP/store" --dry-run true
            echo "### $id $version" >> "$GITHUB_STEP_SUMMARY"
            (cd "packages/$id/$version" && find . -type f -printf '%P  %s bytes\n' | sort) | sed 's/^/    /' >> "$GITHUB_STEP_SUMMARY"
          done

      - name: Keep what was built, for review
        uses: actions/upload-artifact@v4
        with:
          name: packages
          path: packages
          if-no-files-found: ignore
